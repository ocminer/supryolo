name: Publish v0.2.1 release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-v0.2.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v0.2.1
      - name: Retrieve the exact GPU-validated Linux binary
        run: |
          set -euo pipefail
          IMAGE=ocminersupr/supryolo@sha256:cb9a983201f2f32f6ea340a392e3e4b45f607d4e4661c637c5dd96acc8974a4d
          docker pull "$IMAGE"
          CID=$(docker create --entrypoint /bin/true "$IMAGE")
          trap 'docker rm -f "$CID" >/dev/null' EXIT
          mkdir -p dist/verified
          docker cp "$CID:/opt/supryolo/." dist/verified/
          echo '6b63c586bc5c6fa59dd8abed3ff66a7861583b41872d140a5a54e19fa164cc48  dist/verified/supryolo' | sha256sum -c -
          dist/verified/supryolo --version
          python3 tests/terminal.py dist/verified/supryolo
          python3 tests/stratum_mock.py dist/verified/supryolo --cpu
          python3 tests/packaging.py
      - name: Package Linux and rig OS assets with original runtime notices
        run: |
          set -euo pipefail
          export RUNTIME_LICENSE_DIR="$PWD/dist/verified/third_party/runtime"
          for flavor in linux-x86_64 hiveos mmpos; do
            scripts/package-linux.sh dist/verified/supryolo "$PWD/dist" "$flavor"
          done
      - name: Retrieve tested Windows CI package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 34123103264 --repo ocminer/supryolo --name supryolo-windows --dir dist
          cd dist
          sha256sum -c WINDOWS-SHA256SUMS
          cd ..
          python3 scripts/refresh-windows-docs.py dist/supryolo-0.2.1-windows-x86_64.zip
      - name: Export the tested public Docker image
        run: |
          set -euo pipefail
          IMAGE=ocminersupr/supryolo@sha256:cb9a983201f2f32f6ea340a392e3e4b45f607d4e4661c637c5dd96acc8974a4d
          docker pull "$IMAGE"
          docker tag "$IMAGE" ocminersupr/supryolo:0.2.1
          docker run --rm --entrypoint sha256sum "$IMAGE" /opt/supryolo/supryolo | \
            grep '^6b63c586bc5c6fa59dd8abed3ff66a7861583b41872d140a5a54e19fa164cc48 '
          docker save ocminersupr/supryolo:0.2.1 | gzip -1 > dist/supryolo-0.2.1-docker.tar.gz
      - name: Publish assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          gh release create v0.2.1 --repo ocminer/supryolo --verify-tag --title 'supryolo v0.2.1' \
            --notes-file ../docs/RELEASE-NOTES-0.2.1.md *.tar.gz *.zip SHA256SUMS
